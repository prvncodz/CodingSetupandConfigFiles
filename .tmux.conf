set -g base-index 1
set -g pane-base-index 1
set -sg escape-time 0


bind -n C-w new-window

bind  -n C-s split-window -h
bind  -n C-v split-window -v

bind -n C-x if-shell '[ "$(tmux display-message -p "#{window_panes}")" -gt 1 ]' 'kill-pane' 'kill-window'

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind -n M-r command-prompt -I "#W" "rename-window '%%'"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


set -g update-environment "SSH_AUTH_SOCK"
set -g mouse on
set -g status on
set -g status-interval 5

set -g status-style "bg=default,fg=white"

set -g status-left ""
set -g status-right "#[fg=colour8]%H:%M"

set -g window-status-format " #I "
set -g window-status-current-format " #[bold]#I "

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=white"

set -g message-style "bg=default,fg=white"

