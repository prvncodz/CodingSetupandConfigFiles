onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[keys]
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
new_tab = "ctrl+w"
new_workspace = "ctrl+shift+w"
switch_workspace = "ctrl+alt+1..9"
split_vertical = "ctrl+s"
split_horizontal = "ctrl+v"
rename_tab = "alt+r"
switch_tab = "alt+1..9"
close_pane = "ctrl+x"
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
zoom = ["prefix+z", "ctrl+alt+z"]

[ui.toast]
delivery = "herdr"
