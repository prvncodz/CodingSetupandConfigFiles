# Optimized Kitty Configuration for Performance
# Save as: ~/.config/kitty/kitty.conf
# Font
font_family JetBrainsMono
bold_font JetBrainsMono Bold
italic_font JetBrainsMono Italic
bold_italic_font JetBrainsMono Bold Italic
font_size 13.0
# PERFORMANCE OPTIMIZATIONS
# These settings make Kitty MUCH faster
# Reduce input delay (default is 3ms, lower = faster)
input_delay 1
# Reduce repaint delay (default is 10ms, lower = faster)
repaint_delay 0
# Sync to monitor for smoother rendering
sync_to_monitor no
# Disable vsync if you want maximum speed (may cause tearing)
# sync_to_monitor no
# Enable GPU rendering (very important!)
# This should be on by default, but let's ensure it
# No config needed, Kitty uses GPU automatically
# Disable unnecessary features for speed
confirm_os_window_close 0
enable_audio_bell no
map enter send_text all \x0d
map backspace send_text all \x7f
map tab send_text all \x09

# Scrollback buffer (lower = faster, but less history)
scrollback_lines 5000
term xterm-256color
# Cursor
# cursor #f5e0dc
# cursor_text_color #1e1e2e
cursor_blink_interval 0
shell_integration  no-cursor
# Brighter Kitty Color Scheme
# Based on your current theme but with increased brightness and saturation
# The basic colors
foreground              #e8e8e8
background              #1a1a1a
selection_foreground    #1a1a1a
selection_background    #fffacd
#URL underline color when hovering with mouse
url_color               #67d8ef
#Kitty window border colors
active_border_color     #00ff00
inactive_border_color   #555555
#Tab bar colors
active_tab_foreground   #000000
active_tab_background   #00ff00
inactive_tab_foreground #dddddd
inactive_tab_background #333333
#Colors for marks (marked text in the terminal)
mark1_foreground black
mark1_background #98d3cb
mark2_foreground black
mark2_background #f2dcd3
mark3_foreground black
mark3_background #f274bc
#The 16 terminal colors
# black
color0 #2e3436
color8 #555753
# red
color1 #ef5350
color9 #ff6e67
#green
color2  #66bb6a
color10 #83d787
#yellow
color3  #ffca28
color11 #ffd54f
#blue
color4  #42a5f5
color12 #64b5f6
#magenta
color5  #ab47bc
color13 #ce93d8
#cyan
color6  #26c6da
color14 #4dd0e1
#white
color7  #d3d7cf
color15 #eeeeec
# Window
hide_window_decorations yes
# Tab bar (disable if you don't use tabs for speed)
# tab_bar_style hidden
tab_bar_style powerline
tab_powerline_style round

# Mouse
copy_on_select yes
strip_trailing_spaces smart
# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
